<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robotics Career Tracker</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#282a36;color:#f8f8f2;font:15px/1.6 system-ui,sans-serif}a{color:#8be9fd}a:hover{color:#ff79c6}main{max-width:1000px;margin:auto;padding:30px 20px 80px}h1{font-size:32px;margin:10px 0}p{margin:8px 0}.muted{color:#bdbdcb}.accent{color:#bd93f9}.stats,.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stats>div,.job{background:#30323e;border:1px solid #44475a;border-radius:10px;padding:14px 18px}.stats>div{min-width:130px}.stats strong{display:block;font-size:24px}.filters input,.filters select{border:1px solid #44475a;background:#30323e;color:#f8f8f2;padding:10px;border-radius:7px;font:inherit;min-width:180px}.filters input{flex:1}.jobs{display:grid;gap:12px}.job h2{font-size:19px;margin:4px 0}.company{color:#bd93f9;font-weight:bold}.meta{color:#bdbdcb;font-size:13px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tag{border:1px solid #44475a;border-radius:25px;padding:2px 9px;font-size:12px}.open{color:#50fa7b}.check{color:#f1d58e}.job p{font-size:13px}.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#bdbdcb}footer{border-top:1px solid #44475a;margin-top:28px;padding-top:16px;color:#bdbdcb;font-size:12px}
</style></head><body><main>
<a href="/">← Inpyo Lee</a> · <a href="/research-feed/">Research Feed</a>
<p class="accent">ROBOTICS / VLA / PHYSICAL AI</p><h1>Career Tracker</h1>
<p class="muted">국내 로봇학습 연구개발 채용공고 기록입니다. 최초 수집은 신규 게시를 의미하지 않으며, 지원 전 원문을 확인하세요.</p>
<div class="stats"><div><strong id="total">—</strong>공고</div><div><strong id="companies">—</strong>기업</div><div><strong id="open">—</strong>모집 중으로 기록</div></div>
<p class="muted" id="updated">수집 데이터를 읽는 중…</p>
<div class="filters"><input id="search" type="search" placeholder="기업, 직무, 기술 검색" aria-label="검색"><select id="status" aria-label="모집 상태"><option value="">모든 상태</option><option value="open">모집 중</option><option value="check">재확인 필요</option><option value="closed">마감</option></select><select id="field" aria-label="분야"><option value="">모든 분야</option><option value="vla">VLA / Multimodal</option><option value="imitation">Imitation Learning</option><option value="manipulation">Manipulation</option><option value="ros 2">ROS 2</option><option value="physical ai">Physical AI</option></select></div>
<p id="count" class="muted"></p><div class="jobs" id="jobs"></div>
<footer>공개 채용 정보만 표시합니다. 개인 이력서·지원 이력은 공개하지 않습니다.</footer>
</main><script>
const e=id=>document.getElementById(id),node=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=String(text??"");if(cls)n.className=cls;return n;};
let jobs=[];
const state=j=>j.status==="closed"?"closed":j.status==="open"||j.status==="open_until_filled"||j.status==="open_permanent"?"open":"check";
function render(){const q=e("search").value.toLowerCase(),st=e("status").value,f=e("field").value;
const found=jobs.filter(j=>{const all=[j.company,j.position,j.location,...(j.required_skills||[]),...(j.preferred||[])].join(" ").toLowerCase();return(!st||st===state(j))&&(!f||all.includes(f))&&all.includes(q)});
e("count").textContent=found.length+"건 표시";e("jobs").replaceChildren();
for(const j of found){const card=node("article","","job");card.append(node("div",j.company,"company"),node("h2",j.position),node("div",[j.location,j.employment].filter(Boolean).join(" · "),"meta"));const tags=node("div","","tags");tags.append(node("span",state(j)==="open"?"모집 중으로 기록":state(j)==="closed"?"마감":"공식 확인 필요","tag "+(state(j)==="open"?"open":"check")));card.append(tags);
for(const [k,v] of [["학력",j.degree_required],["경력",j.experience_required],["요구 기술",(j.required_skills||[]).join(" · ")],["우대",(j.preferred||[]).join(" · ")],["마감",j.deadline||"일자 미기재"]])card.append(node("p",k+": "+String(v||"미확인")));
if(j.note)card.append(node("p","확인 필요: "+j.note,"muted"));
const foot=node("div","","foot");foot.append(node("span","확인: "+j.verified_at));const link=node("a","공고 원문 ↗");try{const u=new URL(j.url);if(u.protocol!=="https:")throw Error();link.href=u.href;link.target="_blank";link.rel="noopener noreferrer"}catch{link.textContent="출처 링크 미확인"}foot.append(link);card.append(foot);e("jobs").append(card);}
if(!found.length)e("jobs").append(node("p","조건에 맞는 공고가 없습니다.","muted"));}
for(const id of ["search","status","field"])e(id).addEventListener(id==="search"?"input":"change",render);
fetch("./jobs.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("데이터 불러오기 실패");return r.json()}).then(d=>{jobs=Array.isArray(d.jobs)?d.jobs:[];e("total").textContent=jobs.length;e("companies").textContent=new Set(jobs.map(x=>x.company)).size;e("open").textContent=jobs.filter(x=>state(x)==="open").length;e("updated").textContent="마지막 수집: "+d.last_updated;render()}).catch(err=>{e("updated").textContent=err.message});
</script></body></html>
