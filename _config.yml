title: Inpyo Lee
description: Inpyo Lee's personal blog on robotics, AI, papers, and engineering
markdown: kramdown
timezone: Asia/Seoul

collections:
  notes:
    output: true
    permalink: /blog/:name/
  research_feed:
    output: true
    permalink: /research-feed/:name/

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
  - scope:
      path: ""
      type: research_feed
    values:
      layout: feed_note
