name: Daily Research Feed

on:
  schedule:
    # 1차: 03:17 KST (UTC 18:17) 트리거 -> GitHub Actions 4~5시간 지연 감안해 07:30~08:30 KST 게시
    - cron: '17 18 * * *'
    # 2차(백업): 08:47 KST (UTC 23:47) 트리거 -> 1차 누락/부분 실패 시 자동 보충 (이미 있으면 스킵)
    - cron: '47 23 * * *'
  workflow_dispatch:
    inputs:
      backfill_from:
        description: 'Backfill start date (YYYY-MM-DD, leave empty for today only)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-research-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai pymupdf

      - name: Generate daily research feed posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        run: python scripts/generate_research_feed.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _research_feed/ images/research-feed/ 2>/dev/null || git add _research_feed/
          if git diff --staged --quiet; then
            echo "No new research feed post to commit."
          else
            git commit -m "chore: add daily research feed posts"
            git pull --rebase origin main
            git push
          fi
